    <style>
        body {
            background: #0b1220;
            color: #fcf9f9;
            font-family: Segoe UI, sans-serif;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #09111d;
            border-right: 2px solid #FF0000;
            overflow: auto;
        }

        .logo {
            background-color: #d7d7d7;
            border-radius: 10px;
            padding: 10px;
            margin: 30px 10px 20px 10px;
        }

        .imagemlogo {
            width: 200px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .menu a {
            position: relative;
            display: block;
            padding: 10px;
            margin: 4px 10px;
            border-radius: 5px;
            color: #d7d7d7;
            text-decoration: none;
            transition: all .3s ease;
        }

        .menu a::after {
            content: '';
            position: absolute;
            left: 5px;
            right: 5px;
            bottom: 2px;
            height: 1px;
            background: rgba(255, 255, 255, .25);
            transition: all .3s ease;
        }

        .menu a:last-child::after {
            display: none;
        }

        .menu a:hover {
            background: #FF0000;
            color: #fff;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(255, 59, 59, .4);
        }

        .menu a:hover::after {
            background: #FF0000;
            height: 2px;
        }

        .menu i {
            margin-right: 10px;
        }

        .content {
            margin-left: 260px;
            padding: 25px;
        }

        .topbar {
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-left h4 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .top-left small {
            color: #9ca3af;
        }

        .menu-toggle {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #0f1b30;
            color: #f8f7f7;
            font-size: 28px;
        }

        .top-center {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 650px;
            display: flex;
        }

        .search-box input {
            flex: 1;
            background: #0F1B30;
            border: 1px solid #22314d;
            border-right: none;
            color: #fff;
            padding: 12px 15px;
            border-radius: 10px 0 0 10px;
            outline: none;
        }

        .search-box input:focus {
            background: #0f1b30;
            color: #fff;
            box-shadow: none;
        }

        .search-box button {
            width: 55px;
            border: 1px solid #22314d;
            border-left: none;
            background: #0f1b30;
            color: #fff;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
        }

        .search-box button:hover {
            color: #FF0000;
        }

        .top-right {
            display: flex;
            align-items: center;
        }

        .icon-badge {
            position: relative;
            color: #fff;
            font-size: 24px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            padding-right: 20px;
            margin-right: 20px;

            border-right: 1px solid #22314d;
        }

        .icon-badge span {
            position: absolute;
            top: -6px;
            right: 12px;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background: #FF0000;
            color: #fff;

            font-size: 11px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .date-info {
            display: flex;
            align-items: center;
            gap: 10px;

            padding-right: 20px;
            margin-right: 20px;
            font-size: 15px;
            border-right: 1px solid #22314d;
        }

        .date-info small {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
        }

        .date-info strong {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
        }

        .date-info i {
            color: #FF0000;
            font-size: 20px;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-box img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #FF0000;
        }

        .açõesrapidas {
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100px;
            margin-bottom: 10px;


        }

        .dropdown-dark {
            background: #09111d;
            border: 1px solid #22314d;
            border-radius: 10px;
        }

        .dropdown-dark .dropdown-item {
            color: #fff;
            padding: 10px 15px;
        }

        .dropdown-dark .dropdown-item:hover {
            background: #FF0000;
            color: #fff;
        }

        .dropdown-dark .dropdown-divider {
            border-color: #22314d;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-box:hover {
            opacity: .9;
        }
    </style>

    <script>



        document.addEventListener('DOMContentLoaded', function () {

            function atualizarDataHora() {

                const agora = new Date();

                const dias = [
                    "Domingo",
                    "Segunda-feira",
                    "Terça-feira",
                    "Quarta-feira",
                    "Quinta-feira",
                    "Sexta-feira",
                    "Sábado"
                ];

                const diaSemana = dias[agora.getDay()];

                const data = agora.toLocaleDateString('pt-BR');

                const hora = agora.toLocaleTimeString('pt-BR', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                document.getElementById('diaSemana').innerHTML = diaSemana;
                document.getElementById('dataHora').innerHTML = data + ' - ' + hora;
            }

            atualizarDataHora();
            setInterval(atualizarDataHora, 1000);

        });
    </script>
